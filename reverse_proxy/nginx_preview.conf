# File MỚI — chỉ dùng cho preview local trong AI Software Factory (2026-08-29).
# Không đụng nginx_staging.conf (dùng cho staging thật, service name khác).
# Không có block /socket.io/ — backend Java hiện không có dependency
# Socket.IO nào (xem docs/TECHNICAL_DEBT.md mục 6), thêm route chết vào đây
# chỉ gây hiểu lầm.
worker_processes auto;
events { worker_connections 1024; }
error_log /dev/stdout warn;

http {
    include       mime.types;
    default_type  application/octet-stream;

    keepalive_timeout  65;
    sendfile on;

    resolver 127.0.0.11 valid=10s;

    # Chuẩn nginx cho WebSocket — xem chú thích y hệt ở nginx_staging.conf.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        # Gateway factory (gateway/nginx.conf) proxy tới container alias
        # "<slug>-frontend" LUÔN ở cổng 80 — không phải 8888 (đó là cổng
        # nội bộ dùng ở nginx_staging.conf/staging thật, khác ngữ cảnh).
        listen 80;
        server_name _;

        location / {
            set $frontend http://frontend-service;
            proxy_pass $frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            # CHÚ Ý: proxy_pass dùng biến ($x) khiến nginx KHÔNG tự strip
            # prefix location khớp được — request /api/auth/x sẽ bị forward
            # thành /api//api/auth/x (double prefix), rơi vào
            # .anyRequest().authenticated() thay vì khớp allowlist
            # "/api/auth/**" (đã xác minh lỗi thật này lúc build, xem
            # docs/TECHNICAL_DEBT.md). Dùng proxy_pass TĨNH (không biến) để
            # nginx tự strip đúng "/api/" và forward phần còn lại nguyên vẹn.
            proxy_pass http://backend-service:8088/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket (endpoint STOMP /api/ws, WebSocketConfig.java) — cùng
            # lý do/chuẩn đã ghi ở nginx_staging.conf.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
