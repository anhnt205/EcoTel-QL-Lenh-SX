project:
  id: THONGKE-CAOSON
  name: Phần mềm thống kê Cao Sơn
  description: >-
    Hệ thống thống kê sản lượng khai thác/vận tải than mỏ Cao Sơn (Cẩm Phả,
    Quảng Ninh) — nhập liệu chuyến xe/máy xúc theo ca (Vận tải, Khai thác),
    đối chiếu (Reconciliation), danh mục dùng chung (phòng ban, vị trí,
    thiết bị/xe máy, vật tư, loại/nhóm hàng, ca làm việc, người dùng). Dự án
    ĐỘC LẬP trên PostgreSQL — không còn phụ thuộc MongoDB (đã gỡ hẳn cơ chế
    đồng bộ Change Streams cũ, xem TECHNICAL_DEBT lịch sử). Sẽ tích hợp với
    DIEU-PHOI-MM trong tương lai qua cơ chế riêng (chưa thiết kế), KHÔNG
    liên quan TK-HATU. Xác thực qua Portal SSO (app code "tkcs", one-time-code
    exchange, JWT RS256 + claim quyền theo resource) — ĐÃ BẬT LẠI (2026-08-29,
    trước đó bị tắt hoàn toàn lúc onboarding). Source code + lịch sử Git đã có
    sẵn (github.com/anhnt205/THONG_KE_CAO_SON), đưa vào factory bằng onboarding
    (2026-08-29) trên nhánh chore/factory-onboarding — KHÔNG động vào main.

stack:
  frontend: react-vite-typescript
  backend: spring-boot-4 (Java 21)
  database: postgresql

# Đã xác minh THẬT bằng Docker (2026-08-29). Build PASS backend + frontend.
# Test backend FAIL THẬT khi chạy độc lập — @SpringBootTest boot full
# context, không có H2/Testcontainers, cần Postgres/Redis sống (xem
# docs/TECHNICAL_DEBT.md mục 3, chưa sửa — ngoài phạm vi lượt này).
# Preview ĐÃ chạy sống thật (2026-08-29): postgres+redis+backend+frontend+
# reverse-proxy qua deployment/preview/preview-docker-compose.yaml, join
# network factory-preview, verify qua http://thongke-caoson.preview.localhost:8080/
# — public endpoint (health/swagger/auth/exchange-code) truy cập được, API
# nghiệp vụ (/api/users...) trả 401 đúng khi thiếu/token giả — xác nhận auth
# đang hoạt động thật, không phải permitAll như lúc onboarding.
commands:
  build: docker build -t thongkecs-backend-baseline ./backend
  test_backend: docker build --target builder -t thongkecs-backend-builder ./backend && docker run --rm thongkecs-backend-builder mvn -B test
  test: docker build --target builder -t thongkecs-backend-builder ./backend && docker run --rm thongkecs-backend-builder mvn -B test
  # Frontend: package.json không có script "test" — cố tình không khai
  # test_frontend thay vì bịa lệnh không tồn tại thật.
  build_frontend: docker build -t thongkecs-frontend-baseline ./frontend
  # Preview đầy đủ (khuyến nghị) — postgres/redis/backend/frontend/reverse-proxy,
  # tự join network factory-preview. Backend cần JWKS Portal reachable qua
  # alias "portal-gateway" — gắn runtime bằng
  # `docker network connect thongke-caoson-preview_portal-link <container-reverse-proxy-that-cua-PORTAL-PM> --alias portal-gateway`
  # sau khi `docker compose up`, xem .factory/context.md mục "Chạy preview".
  start: docker compose -f deployment/preview/preview-docker-compose.yaml up -d --build
  stop: docker compose -f deployment/preview/preview-docker-compose.yaml down
  # Chạy backend đơn lẻ (không frontend/reverse-proxy) khi dev frontend qua
  # `pnpm dev` riêng — copy backend/.env.example -> backend/.env trước.
  start_backend_only: docker compose -f backend/docker-compose.yaml up -d --build

# ĐÃ BẬT LẠI (2026-08-29) — lý do TẮT ban đầu (lỗ hổng permitAll) đã được xử
# lý (xem docs/TECHNICAL_DEBT.md, mục bảo mật đã đánh dấu ĐÃ SỬA). Vẫn giữ
# TẮT vì đây là quyết định lớn (vừa gỡ hẳn 1 subsystem + đổi cấu hình bảo
# mật) — để chủ dự án tự bật khi đã review kỹ diff, không tự ý bật thay.
automation:
  allow_apply_code: false

pipeline:
  - REQUIREMENT
  - PROVISION
  - ARCHITECTURE
  - CODE
  - BUILD
  - TEST
  - PREVIEW
  - GIT_PUSH
  - APPROVAL
