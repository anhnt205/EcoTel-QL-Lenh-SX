spring:
  application:
    name: thong-ke-cao-son
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  datasource:
    url: jdbc:postgresql://localhost:5440/thong_ke?reWriteBatchedInserts=true
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: true      # bỏ ở production
    show-sql: false           # bật true khi cần debug query
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:1188/.well-known/jwks.json # endpoint lấy public key từ Portal

portal:
  internal-url: http://localhost:1188
app:
  code: tkcs

server:
  port: 8088

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    version: OPENAPI_3_0
    path: /v3/api-docs