spring:
  application:
    name: thong-ke-cao-son

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          jwks-uri: ${PORTAL_JWKS_URI}

server:
  port: ${THONG_KE_PORT}

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    enabled: true
    version: OPENAPI_3_0
    path: /v3/api-docs
