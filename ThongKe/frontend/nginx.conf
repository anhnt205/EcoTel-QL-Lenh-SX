server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Bật gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Quan trọng: redirect tất cả route về index.html cho React Router
    # index.html KHÔNG được cache: file này trỏ tới các chunk JS có hash, nếu trình duyệt giữ bản cũ thì sau mỗi lần
    # deploy người dùng vẫn thấy giao diện cũ (đã gặp: bảng Thống kê sản lượng hiện danh sách cột cũ) cho tới khi Ctrl+F5.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}