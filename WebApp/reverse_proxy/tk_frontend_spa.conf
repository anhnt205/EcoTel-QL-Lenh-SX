# nginx phục vụ bản build frontend Thống kê (SPA) trong docker-compose.thongke-embed.yaml.
# Reverse proxy đã cắt tiền tố /thong-ke/ nên file nằm ở gốc.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
