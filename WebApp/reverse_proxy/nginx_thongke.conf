# Reverse proxy cho bản "Điều phối + Thống kê cùng domain" (chạy thử/ghép).
#
# KHÔNG dùng cho release/staging hiện tại: file này tham chiếu upstream của
# Thống kê (tk_frontend/tk_backend) — nếu nạp vào môi trường không có 2 service
# đó thì nginx không khởi động được. Release/staging vẫn dùng nginx_release.conf
# / nginx_staging.conf, không đổi. Dùng với WebApp/docker-compose.thongke-embed.yaml.
#
#   /            -> frontend Điều phối
#   /api/        -> backend Điều phối (Node/Mongo)
#   /socket.io/  -> backend Điều phối
#   /thong-ke/   -> frontend Thống kê (build VITE_BASE_PATH=/thong-ke/), cắt tiền tố
#   /tk-api/     -> backend Thống kê (Java/Postgres), cắt tiền tố: /tk-api/api/x -> /api/x
#                   (VITE_API_KONG_URL=/tk-api/api; gồm cả WebSocket /tk-api/api/ws)
#
# Điều phối đứng ở /tk/* (SPA), khung nhúng trỏ /thong-ke/* — hai tiền tố KHÁC
# nhau để F5 trang Điều phối không bị proxy trả thẳng ứng dụng Thống kê.

worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream frontend    { server ktv_Frontend_service; }
    upstream backend     { server ktv_Backend_service:8080; }
    upstream tk_frontend { server tk_frontend_service; }
    upstream tk_backend  { server tk_backend_service:8088; }

    # LƯU Ý nginx: proxy_set_header ở cấp location GHI ĐÈ toàn bộ các dòng cấp http này.
    # Location nào tự đặt Upgrade/Connection (socket.io, /tk-api/) phải đặt lại Host và
    # X-Forwarded-* — nếu không Host rơi về tên upstream ("tk_backend", có gạch dưới) và
    # Tomcat của Thống kê trả 400.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 8888;

        location / {
            proxy_pass http://frontend/;
        }

        location /api/ {
            proxy_pass http://backend/api/;
        }

        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # --- Thống kê ---
        location = /thong-ke {
            return 301 /thong-ke/;
        }
        location /thong-ke/ {
            proxy_pass http://tk_frontend/;
        }
        location /tk-api/ {
            proxy_pass http://tk_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
        }
    }
}
